<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#050826;--navy:#0b1450;--blue:#1233d6;--blue2:#0a1fa0;--gold:#ffcf3a;--gold2:#ff9d1c;--ink:#fff;--mute:#9fb0ff;--good:#2fd573;--bad:#ff4d5e;--panel:rgba(14,22,90,.72)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:-30%;z-index:0;background:conic-gradient(from 0deg at 50% 60%,transparent 0 8%,rgba(80,110,255,.16) 10%,transparent 14% 30%,rgba(255,207,58,.10) 33%,transparent 37% 55%,rgba(80,110,255,.16) 58%,transparent 62% 80%,rgba(255,80,160,.10) 83%,transparent 87%);animation:spin 40s linear infinite;pointer-events:none}
body:after{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 0,rgba(60,90,255,.35),transparent 60%),radial-gradient(ellipse at 50% 120%,rgba(255,207,58,.12),transparent 50%);pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(0,0,20,.45);border-bottom:2px solid rgba(255,207,58,.35)}
#top .brand{font-family:Impact,"Arial Black",sans-serif;letter-spacing:2px;color:var(--gold);font-size:22px;margin-right:auto;text-shadow:0 2px 0 #7a4b00}
#top .brand i{font-style:normal;background:var(--bad);color:#fff;font-size:12px;padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:middle;letter-spacing:1px}
.ib{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.2)}
#view{flex:1;overflow:auto;padding:16px 22px;min-height:0}
#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:5px;padding:6px 10px;background:rgba(0,0,20,.6);border-top:2px solid rgba(255,207,58,.35);max-height:24vh;overflow:auto}
.chip{--c:#888;display:flex;justify-content:space-between;gap:6px;align-items:center;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.08);border-left:5px solid var(--c);font-size:13px;min-width:0;transition:.2s}
.chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chip span{font-weight:800;color:var(--gold);white-space:nowrap}
.chip.turn{background:var(--c);color:#000;box-shadow:0 0 18px var(--c);transform:scale(1.04)}
.chip.turn span{color:#000}
.chip.out{opacity:.35;text-decoration:line-through}
h1,h2,h3{margin:0}
.logo{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(44px,8vw,110px);letter-spacing:4px;text-align:center;color:var(--gold);text-shadow:0 4px 0 #8a4f00,0 0 40px rgba(255,207,58,.5);line-height:1}
.logo span{display:block;font-size:.34em;letter-spacing:14px;color:#fff;text-shadow:0 0 20px var(--blue)}
.panel{background:var(--panel);border:2px solid rgba(255,207,58,.4);border-radius:18px;padding:22px;max-width:980px;margin:18px auto;backdrop-filter:blur(4px)}
.lbl{font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--mute);text-align:center;margin-bottom:8px}
.lbl.sm{margin-top:18px;font-size:12px}
.stepper{display:flex;justify-content:center;align-items:center;gap:26px}
.stepper .big{font-family:Impact,sans-serif;font-size:90px;color:var(--gold);min-width:130px;text-align:center;line-height:1}
.rnd{width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);background:var(--blue2);color:#fff;font-size:34px;cursor:pointer}
.rnd:hover{background:var(--blue)}
input[type=range]{width:100%;accent-color:var(--gold);margin:10px 0}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.nm{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border-radius:10px;padding:4px}
.nm i{font-style:normal;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#000;font-weight:800;font-size:13px;flex:none}
.nm input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font-size:16px;outline:none;padding:6px}
.btn{font-family:Impact,"Arial Black",sans-serif;letter-spacing:1.5px;font-size:20px;color:#2a1700;background:linear-gradient(#ffe27a,var(--gold2));border:0;border-bottom:5px solid #a65f00;border-radius:12px;padding:12px 26px;cursor:pointer;text-transform:uppercase}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.xl{font-size:28px;padding:16px 40px;display:block;margin:20px auto 0}
.btn.alt{background:linear-gradient(#7d93ff,#3c52e0);color:#fff;border-bottom-color:#1b2a9a}
.btn.good{background:linear-gradient(#6ff0a0,#1fb35a);color:#033;border-bottom-color:#0b7a37}
.btn.bad{background:linear-gradient(#ff8c98,#e0334a);color:#fff;border-bottom-color:#8f1226}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.sm{font-size:15px;padding:8px 16px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.sub{text-align:center;color:var(--mute);font-size:18px;margin:6px 0}
/* hub */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;max-width:1250px;margin:22px auto}
.card{--a:#fff;text-align:left;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,40,.7));border:3px solid var(--a);border-radius:20px;padding:22px;color:#fff;cursor:pointer;transition:.18s;box-shadow:0 0 0 rgba(0,0,0,0)}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 12px 40px var(--a)}
.card .ic{font-size:64px}
.card h2{font-family:Impact,sans-serif;letter-spacing:2px;font-size:32px;color:var(--a);margin:6px 0}
.card p{color:#dfe5ff;margin:4px 0 12px;min-height:66px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.15);margin-right:6px}
.tag.warn{background:var(--gold);color:#000}
/* jeopardy */
.turnbar{text-align:center;font-size:24px;margin-bottom:10px}
.jgrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px;max-width:1300px;margin:0 auto}
.jcat{text-transform:uppercase;background:var(--blue2);border:2px solid #000;border-radius:6px;min-height:78px;display:grid;place-items:center;text-align:center;padding:8px;font-family:Impact,sans-serif;letter-spacing:1px;font-size:clamp(14px,1.9vw,26px);text-shadow:0 2px 0 #000}
.jtile{background:linear-gradient(var(--blue),var(--blue2));border:2px solid #000;border-radius:6px;min-height:clamp(54px,10vh,100px);color:var(--gold);font-family:Impact,sans-serif;font-size:clamp(26px,4.2vw,58px);text-shadow:0 3px 0 #000;cursor:pointer;transition:.12s}
.jtile:hover{transform:scale(1.05);filter:brightness(1.3);z-index:2}
.jtile.gone{background:rgba(0,0,30,.4);border-color:transparent;cursor:default;pointer-events:none}
.jfoot{text-align:center;margin-top:14px}
.clue{max-width:1150px;margin:0 auto;text-align:center}
.cluemeta{color:var(--gold);font-family:Impact,sans-serif;letter-spacing:3px;font-size:24px}
.cluetext{background:linear-gradient(var(--blue),var(--blue2));border:3px solid #000;border-radius:14px;padding:clamp(24px,6vh,70px) 40px;margin:12px 0;font-size:clamp(26px,4.2vw,56px);font-weight:700;text-transform:uppercase;text-shadow:0 3px 0 #000;line-height:1.25;box-shadow:0 0 50px rgba(30,60,255,.5)}
.ans{font-family:Impact,sans-serif;font-size:clamp(30px,5vw,64px);color:var(--good);margin:10px 0;animation:pop .4s}
.note{font-size:22px;color:var(--gold);margin:6px}
.ddbanner{font-family:Impact,sans-serif;font-size:clamp(40px,8vw,110px);color:var(--gold);letter-spacing:5px;text-shadow:0 4px 0 #8a4f00,0 0 50px var(--gold2);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.06);filter:brightness(1.3)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.wagerrow{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:16px}
.wagerrow input,.wcell input{font-size:28px;width:200px;text-align:center;border-radius:10px;border:3px solid var(--gold);background:#000a;color:#fff;padding:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.pc{--c:#888;background:rgba(255,255,255,.1);border:3px solid var(--c);border-radius:12px;color:#fff;font-size:16px;font-weight:700;padding:12px 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc:hover{background:rgba(255,255,255,.22)}
.pc.sel{background:var(--c);color:#000;transform:scale(1.07);box-shadow:0 0 20px var(--c)}
.pc.dis{opacity:.25;pointer-events:none;text-decoration:line-through}
.pc.x{background:var(--bad);border-color:var(--bad);text-decoration:line-through}
.pc.ok{background:var(--good);border-color:var(--good);color:#032}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.wcell{--c:#888;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(0,0,0,.35);border:3px solid var(--c);border-radius:12px;padding:10px}
.wcell input{width:100%;font-size:22px}
.fcat{font-family:Impact,sans-serif;font-size:clamp(30px,5vw,70px);letter-spacing:3px;margin:8px 0}
/* timer */
.timerrow{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0}
.tbar{flex:1;max-width:620px;height:16px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--gold),var(--bad));background-size:300% 100%;background-position:0 0;transition:width .1s linear}
.tnum{font-family:Impact,sans-serif;font-size:36px;color:var(--gold);min-width:60px}
/* geo */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1100px;margin:0 auto 8px;font-family:Impact,sans-serif;letter-spacing:2px;font-size:22px;color:var(--gold)}
.cl{max-width:1100px;margin:8px auto;display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,var(--blue2),var(--blue));border:3px solid #000;border-radius:14px;padding:14px 20px;font-size:clamp(18px,2.4vw,32px);font-weight:600;animation:pop .35s}
.cl b{font-family:Impact,sans-serif;font-size:1.5em;color:var(--gold);min-width:1.3em}
.cl.lock{background:rgba(0,0,30,.45);color:var(--mute);border-style:dashed;border-color:rgba(255,255,255,.25);font-size:20px;animation:none}
.cl img{max-height:150px;border-radius:8px}
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px}
.reveal img.flag{height:120px;border:3px solid #fff;border-radius:6px;box-shadow:0 6px 24px #000a}
.reveal h2{font-family:Impact,sans-serif;font-size:clamp(46px,8vw,110px);color:var(--good);letter-spacing:3px;animation:pop .45s}
/* survival */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1100px;margin:14px auto}
.opt{display:flex;gap:14px;align-items:center;border-radius:14px;padding:clamp(14px,3vh,34px) 20px;font-size:clamp(20px,2.8vw,40px);font-weight:700;border:4px solid rgba(255,255,255,.2);transition:.3s}
.opt b{font-family:Impact,sans-serif;font-size:1.5em;width:1.4em;height:1.4em;border-radius:50%;background:#000a;display:grid;place-items:center;flex:none}
.o0{background:#d62839}.o1{background:#1d6fe0}.o2{background:#d79a00;color:#1a1100}.o3{background:#1f9d4d}
.opt.dim{opacity:.18;filter:grayscale(1)}
.opt.right{border-color:#fff;box-shadow:0 0 40px #fff;transform:scale(1.04)}
.bigq{font-size:clamp(26px,4vw,54px);font-weight:800;text-align:center;max-width:1100px;margin:10px auto;text-shadow:0 3px 0 #000}
/* globe trotters */
.joinbox{display:flex;gap:30px;justify-content:center;align-items:center;flex-wrap:wrap;background:var(--panel);border:2px solid rgba(255,207,58,.4);border-radius:18px;padding:14px 26px;margin:10px auto;max-width:900px}
.joinurl{font-family:Impact,sans-serif;font-size:clamp(24px,3.6vw,48px);color:#fff;letter-spacing:1px;text-align:center}
.code{font-family:Impact,sans-serif;font-size:clamp(46px,7vw,100px);color:var(--gold);letter-spacing:10px;text-align:center;line-height:1}
.settings{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.settings label{display:flex;flex-direction:column;gap:3px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);font-weight:700}
.settings label.chk{flex-direction:row;align-items:center;gap:8px;align-self:flex-end;padding-bottom:8px}
.settings select{font-size:16px;padding:8px;border-radius:8px;background:#000a;color:#fff;border:2px solid var(--gold)}
.gtimg{max-height:46vh;max-width:100%;border-radius:14px;border:4px solid #fff;margin:6px auto;display:block;box-shadow:0 8px 30px #000a}
.gtrev{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:6px}
#gtmap{height:min(58vh,560px);border-radius:14px;border:3px solid #fff;background:#aad3df}
.gtlist{max-height:min(58vh,560px);overflow:auto;display:grid;gap:5px;align-content:start}
.rrow{display:grid;grid-template-columns:1.6em 1fr auto auto;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-left:6px solid var(--c);border-radius:8px;padding:6px 10px;font-size:15px}
.rrow em{font-style:normal;color:var(--mute);font-size:13px}.rrow strong{color:var(--gold)}
.gtstar{font-size:34px;line-height:34px;text-shadow:0 0 6px #000}
.gtdot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #000}
@media (max-width:900px){.gtrev{grid-template-columns:1fr}}
/* party games */
.sfcards{display:grid;gap:12px;max-width:1100px;margin:12px auto}
.cnt{font-style:normal;font-family:Impact,sans-serif;font-size:.7em;letter-spacing:1px;margin-left:auto;white-space:nowrap}
.opt.truth{opacity:.55}
.opt span{flex:1}
/* leftover */
.hl{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;max-width:1200px;margin:14px auto}
.hcard{background:linear-gradient(160deg,var(--blue),var(--blue2));border:4px solid #000;border-radius:20px;padding:26px 16px;text-align:center;box-shadow:0 0 40px rgba(30,60,255,.5)}
.hcard h3{font-size:clamp(20px,2.8vw,38px);font-weight:800}
.hcard .val{font-family:Impact,sans-serif;font-size:clamp(46px,7vw,100px);color:var(--gold);text-shadow:0 4px 0 #000;margin:10px 0;line-height:1}
.hcard small{color:var(--mute);font-size:16px}
.vs{font-family:Impact,sans-serif;font-size:42px;color:var(--gold)}
.verdict{font-family:Impact,sans-serif;font-size:clamp(40px,7vw,90px);letter-spacing:4px;animation:pop .4s;text-align:center}
.verdict.up{color:var(--good)}.verdict.dn{color:var(--bad)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:1100px;margin:16px auto}
/* results */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:20px auto;max-width:800px}
.pod{--c:#888;flex:1;text-align:center;border-radius:14px 14px 0 0;background:linear-gradient(var(--c),rgba(0,0,0,.4));padding:14px 6px;animation:rise .8s backwards}
.pod .nmn{font-weight:800;font-size:clamp(16px,2.4vw,30px);color:#000;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-family:Impact,sans-serif;font-size:clamp(20px,3vw,40px);color:#000}
.pod .md{font-size:48px}
@keyframes rise{from{transform:translateY(200px);opacity:0}}
.rest{max-width:560px;margin:0 auto;display:grid;gap:5px}
.rest div{display:flex;justify-content:space-between;background:rgba(255,255,255,.08);border-radius:8px;padding:6px 12px}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:50;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* lobby */
.pc.pop{animation:pop .45s}
.buzzbanner{max-width:900px;margin:8px auto;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.1);font-size:clamp(16px,2vw,24px);font-weight:700;text-align:center}
.buzzbanner.open{background:rgba(47,213,115,.22);border:2px solid var(--good)}
.buzzbanner.got{background:rgba(255,207,58,.22);border:2px solid var(--gold);animation:pop .35s}
.card.sm{padding:14px;border-width:3px}.card.sm .ic{font-size:40px}.card.sm h2{font-size:22px}.card.sm p{min-height:0;font-size:14px;margin:2px 0 0}
.card.picked{transform:translateY(-4px);box-shadow:0 0 0 4px var(--a),0 10px 36px var(--a);background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(0,0,40,.7))}
.gamebadge{font-family:Impact,sans-serif;letter-spacing:3px;color:var(--a,#fff);font-size:clamp(26px,4vw,52px)}
.lobbywrap{max-width:1150px;margin:0 auto;text-align:center}
.hint{color:var(--mute);font-size:14px;margin:4px auto;max-width:520px}
/* teams */
.trow{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip.tchip{flex:1;min-width:120px;background:var(--c);color:#000;font-size:15px}
.chip.tchip span{color:#000}
.chip .td{width:9px;height:9px;border-radius:50%;flex:none;margin-right:-2px;border:1px solid #0008}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.tbox{--c:#888;border:3px solid var(--c);border-radius:12px;padding:8px;background:rgba(0,0,0,.3);display:flex;flex-direction:column;gap:5px;align-content:start}
.tbox .th{font-family:Impact,sans-serif;letter-spacing:2px;color:var(--c);font-size:20px;text-transform:uppercase;text-align:center}
.tbox .th small{color:var(--mute);font-family:"Segoe UI",sans-serif;letter-spacing:0}
.tm{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;padding:6px 8px;font-size:15px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm:hover{background:rgba(255,255,255,.25)}.tm.off{opacity:.4}
@media (max-width:760px){.hl{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.stepper .big{font-size:60px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand">GAME NIGHT <i>LIVE</i></div>
    <button class="ib" data-act="home" title="Back to the lobby">🏠 Lobby</button>
    <button class="ib" data-act="mute" id="mutebtn" title="Sound on/off">🔊</button>
    <button class="ib" data-act="logout" id="logoutbtn" title="Log out of the host account" hidden>🔒 Log out</button>
  </div>
  <main id="view"></main>
  <footer id="board" hidden></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="banks/jeopardy.js"></script>
<script src="banks/crowdcontrol.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>Number(n).toLocaleString('en-US');
const money=n=>(n<0?'-':'')+'$'+fmt(Math.abs(n));
const rand=n=>Math.floor(Math.random()*n);
const colorOf=i=>`hsl(${Math.round((i*137.508)%360)} 78% 58%)`;
const BANKS=window.BANKS;

/* ================= sound ================= */
const Snd=(()=>{
  let ctx,master,bus,muted=false,vol=.7,timer=null,lid=0;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=vol;master.connect(ctx.destination);}
    if(ctx.state==='suspended')ctx.resume();
  }
  function tone(m,t,d,o={}){
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type=o.type||'triangle';osc.frequency.setValueAtTime(hz(m),t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.g??.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    osc.connect(g);g.connect(o.dest||master);osc.start(t);osc.stop(t+d+.05);
  }
  // 8 eighth-notes per bar; pat indexes into the chord (idx>=len goes up an octave)
  function arp(chords,bpm,{pat,type='triangle',g=.14,shift=12}){
    const e=60/bpm/2,ev=[];
    chords.forEach((c,b)=>{
      const t0=b*8*e;
      pat.forEach((ix,k)=>{if(ix!==null)ev.push({m:c[ix%c.length]+12*Math.floor(ix/c.length)+shift,t:t0+k*e,d:e*.9,type,g});});
      ev.push({m:c[0]-12,t:t0,d:e*3.6,type:'sine',g:.3});
      ev.push({m:c[0]-5,t:t0+4*e,d:e*3.6,type:'sine',g:.25});
    });
    return{events:ev,len:chords.length*8*e};
  }
  const TRACKS={
    lobby:()=>arp([[60,64,67],[57,60,64],[53,57,60],[55,59,62]],126,{pat:[0,1,2,3,2,1,2,4]}),
    groove:()=>arp([[48,52,55,59],[45,48,52,55],[50,53,57,60],[43,47,50,53]],92,{pat:[0,null,2,1,null,3,2,null],type:'sine',g:.18}),
    think:()=>arp([[57,60,64],[53,57,60],[50,53,57],[52,56,59]],112,{pat:[0,1,2,1,0,1,2,3],type:'square',g:.045,shift:12}),
    hurry:()=>arp([[57,60,64],[53,57,60],[50,53,57],[52,56,59]],140,{pat:[0,1,2,1,0,1,2,3],type:'square',g:.05,shift:12}),
  };
  function stop(){
    lid++;clearTimeout(timer);
    if(bus&&ctx){const b=bus;b.gain.cancelScheduledValues(ctx.currentTime);b.gain.setTargetAtTime(0,ctx.currentTime,.06);setTimeout(()=>b.disconnect(),600);}
    bus=null;
  }
  function loop(name){
    init();stop();const id=lid,tr=TRACKS[name]();
    bus=ctx.createGain();bus.gain.value=1;bus.connect(master);const myBus=bus;
    const run=()=>{if(id!==lid)return;const t=ctx.currentTime+.05;tr.events.forEach(e=>tone(e.m,t+e.t,e.d,{type:e.type,g:e.g,dest:myBus}));timer=setTimeout(run,tr.len*1000-60);};
    run();
  }
  function seq(list,type='triangle',g=.2){init();let t=ctx.currentTime+.02;list.forEach(([m,d,gap])=>{if(m)tone(m,t,d*1.4,{type,g});t+=gap??d;});}
  function noise(dur,g=.25){
    const n=ctx.sampleRate*dur,buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5)*(.5+.5*Math.sin(i/900));
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),gn=ctx.createGain();f.type='bandpass';f.frequency.value=2400;gn.gain.value=g;
    s.buffer=buf;s.connect(f);f.connect(gn);gn.connect(master);s.start();
  }
  const FX={
    correct:()=>seq([[72,.09],[76,.09],[79,.09],[84,.4]],'triangle',.25),
    wrong:()=>{init();const t=ctx.currentTime;tone(45,t,.55,{type:'sawtooth',g:.22});tone(44,t,.55,{type:'square',g:.12});},
    buzz:()=>seq([[88,.12]],'square',.12),
    tick:()=>seq([[84,.04]],'square',.06),
    tickHi:()=>seq([[91,.05]],'square',.09),
    timeup:()=>{init();const t=ctx.currentTime;[0,.25,.5].forEach(o=>tone(52,t+o,.2,{type:'sawtooth',g:.2}));},
    reveal:()=>seq([[67,.12],[72,.5]],'triangle',.25),
    dd:()=>seq([[60,.08],[64,.08],[67,.08],[72,.08],[76,.08],[79,.08],[84,.08],[88,.08],[91,.6]],'sawtooth',.1),
    out:()=>seq([[60,.3],[59,.3],[58,.3],[55,.9]],'sawtooth',.16),
    pick:()=>seq([[76,.05],[83,.09]],'square',.1),
    win:()=>{seq([[60,.14],[60,.14],[60,.14],[60,.45],[56,.45],[58,.45],[60,.16,.2],[58,.16],[60,1]],'sawtooth',.14);setTimeout(()=>{init();const t=ctx.currentTime;[60,64,67,72].forEach(m=>tone(m,t,1.6,{type:'triangle',g:.14}));noise(2.6,.3);},2000);},
  };
  return{
    init,stop,loop,
    play:n=>{init();if(FX[n])FX[n]();},
    toggle:()=>{init();muted=!muted;master.gain.value=muted?0:vol;return muted;},
  };
})();

const T={id:null,
  start(sec,{onEnd,tickFrom=5}={}){
    T.stop();const t0=performance.now();let last=null;

      const left=Math.max(0,sec-(performance.now()-t0)/1000);
      const f=$('#tfill'),n=$('#tnum');
      if(f){f.style.width=(left/sec*100)+'%';f.style.backgroundPosition=((1-left/sec)*100)+'% 0';}
      if(n)n.textContent=Math.ceil(left);
      const ls=Math.ceil(left);
      if(ls!==last){last=ls;if(ls<=tickFrom&&ls>0)Snd.play(ls<=3?'tickHi':'tick');}
      if(left<=0){T.stop();onEnd&&onEnd();}
    },100);
  },
  stop(){clearInterval(T.id);T.id=null;},
  html(sec){return`<div class="timerrow"><div class="tbar"><i id="tfill"></i></div><div class="tnum" id="tnum">${sec}</div></div>`;}
};

/* ================= the live room: players join on their phones with the game code ================= */
// The room is created when the host opens the lobby and stays open for the whole game night. Every game uses the players
// who joined it. Globe Trotters is played on the phones; the other three are host-run (the host taps names on this screen).
const ROOM={
  es:null,st:null,off:0,tok:null,code:null,
  save(){try{localStorage.setItem('gn.room',JSON.stringify({code:ROOM.code,token:ROOM.tok}));}catch(e){}},
  forget(){try{localStorage.removeItem('gn.room');}catch(e){}},
  post(path,body){
    return fetch(path+'?code='+encodeURIComponent(ROOM.code),{method:'POST',headers:{'content-type':'application/json','x-token':ROOM.tok},body:JSON.stringify(body||{})}).catch(()=>{});
  },
  leave(){ // forget this room (the server closes it when a new one is made)
    if(ROOM.es){ROOM.es.close();ROOM.es=null;}
    ROOM.st=null;ROOM.tok=null;ROOM.code=null;ROOM.forget();
  },
  connect(onFirst){
    const es=ROOM.es=new EventSource('/api/events?role=host&code='+encodeURIComponent(ROOM.code)+'&token='+encodeURIComponent(ROOM.tok));
    let first=true;const fin=ok=>{if(first){first=false;onFirst&&onFirst(ok);}};
    es.onmessage=e=>{
      const s=JSON.parse(e.data);
      if(s.phase==='closed'){ROOM.leave();fin(false);return;}
      ROOM.st=s;ROOM.off=s.now-Date.now();fin(true);ROOM.changed();
    };
    es.onerror=()=>{
      if(first){if(es.readyState===EventSource.CLOSED){ROOM.leave();fin(false);}return;} // resume refused: that game is over
      // an established stream dropped for good (a browser refresh also fires this): never forget the room, just reconnect
      if(es.readyState===EventSource.CLOSED&&ROOM.es===es)setTimeout(()=>{if(ROOM.es===es&&ROOM.code)ROOM.connect();},2000);
    };
  },
  async create(max,teams,game){
    const r=await fetch('/api/host/new',{method:'POST'});
    if(r.status===401){location.href='/login';return false;}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();ROOM.tok=j.token;ROOM.code=j.code;ROOM.save();
    await ROOM.post('/api/host/settings',{max,teams,game});
    await new Promise(res=>ROOM.connect(res));
    return !!ROOM.st;
  },
  resume(){ // after a page refresh, pick the same game back up
    return new Promise(res=>{
      let saved=null;try{saved=JSON.parse(localStorage.getItem('gn.room')||'null');}catch(e){}
      if(!saved||!saved.code||!saved.token)return res(false);
      ROOM.code=saved.code;ROOM.tok=saved.token;
      const t=setTimeout(()=>{if(!ROOM.st){ROOM.leave();res(false);}},4000);
      ROOM.connect(ok=>{clearTimeout(t);res(ok);});
    });
  },
  changed(){ // a fresh snapshot arrived: refresh whatever screen is showing
    const s=ROOM.st;
    const gm=s.settings.game,live=gm==='globetrotters'?GT:gm==='spotthefake'?SF:null,key=gm==='globetrotters'?'gt':'sf';
    if(live&&s.phase!=='lobby'&&!(G&&G.g===key)){live.begin();return;} // the host pressed Start (or refreshed mid-game)
    if(G&&(G.g==='gt'||G.g==='sf')){G.lp=s.players;(G.g==='gt'?GT:SF).render();return;}
    if(G&&G.g==='jp'){JP.onRoom();return;}
    if(S.screen==='lobby')LOBBY.draw();
  },
};
function syncPlayers(){ // host-run games use the players who have joined so far (scores start at 0)
  const s=ROOM.st;
  players=(s?s.players:[]).map(p=>({id:+p.id,name:p.name,color:p.color,score:0,out:false,streak:0,team:p.team}));
}
/* ---- teams: team score = sum of its members' scores (teams are assigned by the server) ---- */
function teamTotals(){ // null when playing solo
  const t=ROOM.st&&ROOM.st.teams;

  return t.map(x=>({id:x.id,name:x.name,color:x.color,score:players.filter(p=>p.team===x.id).reduce((a,p)=>a+p.score,0)}));
}

    if(s.teams){
      box.innerHTML=teamBoxes(s.teams,s.players,'gt-move')+'<div class="hint">Tap a player to move them to the next team</div>';
    }else{
      // add new names one by one so each pops in, and never redraw the ones already there (that would cut the animation short)
      let grid=box.querySelector('.pgrid[data-flat]');
      if(!grid){box.innerHTML='<div class="pgrid" data-flat></div>';grid=box.firstChild;}
      s.players.forEach(p=>{
        let el=grid.querySelector(`[data-pid="${p.id}"]`);
        if(!el){el=document.createElement('div');el.className='pc pop';el.dataset.pid=p.id;el.style.cursor='default';el.style.setProperty('--c',p.color);el.textContent=p.name;grid.appendChild(el);}
        el.style.opacity=p.connected?'':'.4';
      });
    }
    $('#lshuf').hidden=!s.teams;
    let noPhotos=false;
    if(g.id==='globetrotters'){ // photo only: players see a photo, never the place's name, so places without a photo are not used
      noPhotos=!s.photos;
      $('#lphotos').innerHTML=noPhotos
        ?'<b style="color:var(--bad)">⚠️ No place photos have been added yet.</b> Globe Trotters is photo-only, so it can\'t start. Run <code>fetch_images.py</code> (see the README), push the result, and wait for the deploy.'
        :`📷 Photo only: players see a picture and drop a pin. ${s.photos} of ${s.count} places have photos and will be used.`;
    }
    $('#lgo').disabled=!s.players.length||noPhotos;
  },
};

/* ================= GAME 1: THE BIG BOARD ================= */
const JP={
  buzz(cmd,locked){ // control the phones' buzzers (the server decides who buzzed in first)
    if(ROOM.st&&ROOM.st.settings.game==='jeopardy')ROOM.post('/api/host/buzz',{cmd,locked:(locked||[]).map(String)});
  },
  ensurePlayers(){ // players who joined after the board started
    ROOM.st.players.forEach(p=>{const id=+p.id;if(!players[id])players[id]={id,name:p.name,color:p.color,score:0,out:false,streak:0,team:p.team};});
  },
  startTimer(){ // the answer timer (length is set in the lobby) starts by itself when someone buzzes in
    const secs=(ROOM.st&&ROOM.st.settings.answerSeconds)||15;
    Snd.loop('think');T.start(secs,{tickFrom:5,onEnd:()=>{Snd.stop();Snd.play('timeup');}});
  },
  onRoom(){ // a fresh snapshot arrived while a clue is up: did someone buzz in?
    const s=ROOM.st;
    if(!s||!G||G.g!=='jp'||S.screen!=='jp-clue'||!G.cur||G.cur.dd||G.cur.peek||G.cur.stage!=='open')return;
    const z=s.buzz||{},by=z.by,k=(by?by.id:'-')+'|'+(z.open?1:0)+'|'+z.seq;
    if(G.cur.bk===k)return;G.cur.bk=k;
    if(by){JP.ensurePlayers();const id=+by.id;let started=false;if(players[id]&&!G.locked.has(id)){G.cur.sel=id;T.stop();Snd.stop();Snd.play('buzz');started=true;}
      JP.clue();if(started)JP.startTimer();return;}
    JP.clue();
  },
  start(i){
    const b=BANKS.jeopardy.boards[i];resetScores();
    const cells=[];b.categories.forEach((c,ci)=>c.clues.forEach((_,ri)=>{if(ri>0)cells.push(ci+'-'+ri);}));
    G={g:'jp',id:'jeopardy',bi:i,b,used:new Set(),dd:new Set(shuffle(cells).slice(0,b.dailyDoubles??1)),turn:rand(players.length),locked:new Set(),f:null};
    JP.buzz('on');
    JP.board();
  },
  cl:()=>G.b.categories[G.cur.ci].clues[G.cur.ri],
  board(){
    S.screen='jp-board';T.stop();Snd.loop('groove');
    const cats=G.b.categories,rows=Math.max(...cats.map(c=>c.clues.length)),p=players[G.turn];
    let h=`<div class="turnbar">🎤 <b style="color:${p.color}">${esc(p.name)}</b> picks the next clue</div><div class="jgrid" style="--cols:${cats.length}">`;
    cats.forEach(c=>h+=`<div class="jcat">${esc(c.name)}</div>`);
    for(let r=0;r<rows;r++)cats.forEach((c,ci)=>{
      const cl=c.clues[r],k=ci+'-'+r;
      h+=!cl||G.used.has(k)?'<div class="jtile gone"></div>':`<button class="jtile" data-act="jp-pick" data-k="${k}">${money(cl.v)}</button>`;
    });
    h+=`</div><div class="jfoot"><button class="btn alt" data-act="jp-final">Go to Final Round ▸</button></div>`;
    $('#view').innerHTML=h;renderBoard();
  },
  clue(){
    const c=G.cur,cat=G.b.categories[c.ci],cl=JP.cl(),p=players[G.turn];S.screen='jp-clue';
    let h=`<div class="clue"><div class="cluemeta">${esc(cat.name)} · ${money(cl.v)}</div>`;
    if(c.stage==='wager'){
      const max=Math.max(p.score,1000);
      h+=`<div class="ddbanner">DAILY DOUBLE!</div><p class="sub"><b style="color:${p.color}">${esc(p.name)}</b>, how much do you wager? (up to ${money(max)})</p>
      <div class="wagerrow"><input id="wager" type="number" min="5" max="${max}" step="5" value="${Math.min(max,1000)}"><button class="btn" data-act="jp-wager">Lock it in</button></div></div>`;
      $('#view').innerHTML=h;return;
    }
    h+=`<div class="cluetext">${esc(cl.q)}</div>`;
    if(c.stage==='done'){
      h+=`<div class="ans">${esc(cl.a)}</div>${c.note?`<div class="note">${esc(c.note)}</div>`:''}<button class="btn xl" data-act="jp-back">Back to Board</button>`;
    }else{
      if(c.peek)h+=`<div class="ans">${esc(cl.a)}</div><div class="note">Answer revealed. Now mark it:</div>`;
      else{
        const secs=(ROOM.st&&ROOM.st.settings.answerSeconds)||15,auto=!c.dd&&ROOM.st&&ROOM.st.buzz&&ROOM.st.buzz.on;
        h+=T.html(secs)+(auto?'<div class="sub" style="font-size:14px">The answer timer starts by itself when someone buzzes in.</div>':`<div class="row" style="margin-top:0"><button class="btn sm alt" data-act="jp-timer">⏱ Start ${secs}s timer</button></div>`);
      }
      if(c.dd){
        h+=`<p class="sub"><b style="color:${p.color}">${esc(p.name)}</b> answers for ${money(c.wager)}</p><div class="row"><button class="btn good" data-act="jp-ok">✓ Correct</button><button class="btn bad" data-act="jp-no">✗ Wrong</button>${c.peek?'':'<button class="btn alt" data-act="jp-peek">👁 Show answer first</button>'}</div>`;
      }else{
        const z=ROOM.st&&ROOM.st.buzz,by=z&&z.by,tm=by&&ROOM.st.teams&&by.team!=null?ROOM.st.teams[by.team]:null;
        if(z&&z.on)h+=by?`<div class="buzzbanner got">⚡ <b style="color:${by.color}">${esc(by.name)}</b>${tm?` · Team ${esc(tm.name)}`:''} buzzed in first${by.ms!=null?` (${(by.ms/1000).toFixed(2)}s)`:''}! They say the answer out loud, then you mark it.</div>`:z.open?'<div class="buzzbanner open">🔔 Buzzers are OPEN: players buzz in on their phones…</div>':'<div class="buzzbanner">🔕 Buzzers are closed</div>';
        h+=`<p class="sub">${z&&z.on?'Or tap a name yourself if someone can\'t buzz:':'Who buzzed in first? Tap their name.'}</p>`+pgrid('jp-sel',q=>(G.locked.has(q.id)?'dis':c.sel===q.id?'sel':''))+
        `<div class="row"><button class="btn good" data-act="jp-ok" ${c.sel==null?'disabled':''}>✓ Correct</button><button class="btn bad" data-act="jp-no" ${c.sel==null?'disabled':''}>✗ Wrong</button>${c.peek?'':'<button class="btn alt" data-act="jp-peek">👁 Show answer first</button>'}<button class="btn alt" data-act="jp-reveal">Nobody — show answer</button></div>`;
      }
    }
    $('#view').innerHTML=h+'</div>';renderBoard();
  },
  final(){
    const f=G.b.final;S.screen='jp-final';T.stop();
    if(!G.f)G.f={stage:'wager',w:{},res:{}};
    const F=G.f;let h=`<div class="clue"><div class="ddbanner" style="font-size:clamp(34px,6vw,80px)">FINAL ROUND</div><div class="fcat">${esc(f.category)}</div>`;
    if(F.stage==='wager'){
      Snd.loop('groove');
      h+=`<p class="sub">Secret wagers: each player writes one down (up to their score). Enter them here.</p><div class="wgrid">${players.map(p=>`<label class="wcell" style="--c:${p.color}"><b>${esc(p.name)}</b><small>${money(p.score)}</small><input type="number" min="0" max="${Math.max(0,p.score)}" step="100" value="${F.w[p.id]??0}" data-id="${p.id}" ${p.score<=0?'disabled':''}></label>`).join('')}</div><button class="btn xl" data-act="jp-fclue">Show the Clue</button>`;
    }else if(F.stage==='clue'){
      h+=`<div class="cluetext">${esc(f.q)}</div>${T.html(30)}<div class="row"><button class="btn alt" data-act="jp-freveal">Reveal Answer</button></div>`;
    }else{
      h+=`<div class="cluetext">${esc(f.q)}</div><div class="ans">${esc(f.a)}</div><p class="sub">Tap each player to mark right (green) or wrong (red).</p><div class="pgrid">${players.map(p=>{const r=F.res[p.id]||0;return`<button class="pc ${r===1?'ok':r===2?'x':''}" style="--c:${p.color}" data-act="jp-ftog" data-id="${p.id}">${esc(p.name)}<br><small>wager ${money(F.w[p.id]||0)}</small></button>`;}).join('')}</div><button class="btn xl" data-act="jp-fdone">Final Scores</button>`;
    }
    $('#view').innerHTML=h+'</div>';renderBoard();
  },
};

const GT={
  iv:null,map:null,key:'',shown:false,
  stop(){ // leaving the Globe Trotters screens (the room itself stays open)
    clearInterval(GT.iv);GT.iv=null;
    if(GT.map){GT.map.remove();GT.map=null;}
    GT.key='';GT.shown=false;
  },
  begin(){ // the room left its lobby (the host pressed Start, or refreshed mid-game): show the live game
    GT.stop();Snd.stop();lastGame='globetrotters';S.screen='gt';G={g:'gt',id:'globetrotters',lp:ROOM.st.players};renderBoard();GT.render();
  },
  again(){S.screen='gt';GT.shown=false;GT.key='';ROOM.post('/api/host/again');},
  render(){
    const s=ROOM.st;if(!s||!G||G.g!=='gt')return;
    if(s.phase==='closed')return;
    if(s.phase!=='end'&&S.screen==='results')S.screen='gt';
    renderBoard();
    if(s.phase==='lobby'){viewLobby();return;} // Play Again / left the game: back to the lobby
    else if(s.phase==='guess')GT.guess();
    else if(s.phase==='reveal')GT.reveal();
    else if(s.phase==='end'&&!GT.shown){GT.shown=true;GT.key='';clearInterval(GT.iv);if(GT.map){GT.map.remove();GT.map=null;}finish('FINAL SCORES');}
  },
  guess(){
    const s=ROOM.st,k='g'+s.idx;
    if(GT.key!==k||!$('#gtg')){
      GT.key=k;if(GT.map){GT.map.remove();GT.map=null;}Snd.loop('think');
      const p=s.prompt;
      $('#view').innerHTML=`<div id="gtg" class="clue" style="max-width:1150px"><div class="qhead"><span>ROUND ${s.idx+1} / ${s.total}</span><span id="gtlk"></span></div>
        ${p.image?`<img class="gtimg" src="${esc(p.image)}" alt="" onerror="this.remove()">`:''}
        <div class="note" style="font-size:18px">${esc(p.category.toUpperCase())}</div>
        <div class="ddbanner" style="font-size:clamp(30px,5.5vw,80px);letter-spacing:2px;animation:none">${p.name?esc(p.name):'WHAT IS THIS PLACE?'}</div>
        <div class="sub" style="font-size:18px">Pick the name on your phone <b>and</b> drop a pin</div>
        ${T.html(s.settings.seconds)}<div class="row" style="margin-top:0"><button class="btn sm alt" data-act="gt-reveal">Reveal now</button></div></div>`;
      clearInterval(GT.iv);let last=null;
      GT.iv=setInterval(()=>{
        const left=Math.max(0,(ROOM.st.deadline-(Date.now()+ROOM.off))/1000),tot=ROOM.st.settings.seconds,f=$('#tfill'),n=$('#tnum');
        if(f){f.style.width=(left/tot*100)+'%';f.style.backgroundPosition=((1-left/tot)*100)+'% 0';}
        if(n)n.textContent=Math.ceil(left);
        const ls=Math.ceil(left);if(ls!==last){last=ls;if(ls<=5&&ls>0)Snd.play(ls<=3?'tickHi':'tick');}
      },150);
    }
    const lk=s.players.filter(p=>p.locked).length;
    $('#gtlk').textContent=`${lk} / ${s.players.length} LOCKED IN`;
  },
  reveal(){
    const s=ROOM.st,k='r'+s.idx;
    if(GT.key===k&&$('#gtr'))return;
    GT.key=k;clearInterval(GT.iv);Snd.stop();Snd.play('reveal');
    if(GT.map){GT.map.remove();GT.map=null;}
    const a=s.answer,fk=d=>d==null?'no guess':(d<10?d.toFixed(1):Math.round(d).toLocaleString())+' km';
    $('#view').innerHTML=`<div id="gtr"><div class="qhead" style="max-width:none"><span>ROUND ${s.idx+1} / ${s.total}</span><span>${esc(a.name.toUpperCase())} · ${esc(a.country.toUpperCase())}</span></div>
      <div class="gtrev"><div id="gtmap"></div>
      <div class="gtlist"><div class="note" style="font-size:16px;text-align:left;color:var(--good)">${s.results.filter(r=>r.correct).length} of ${s.results.length} knew it · ✅ knew what it is (+2,500) · 📍 pin (up to +2,500)</div><div class="note" style="font-size:16px;text-align:left">${esc(a.blurb||'')}${a.credit?`<br><small style="color:var(--mute)">Photo: ${esc(a.credit)}</small>`:''}</div>
      ${s.teams?s.teams.slice().sort((x,y)=>y.score-x.score).map((t,i)=>`<div class="rrow" style="--c:${t.color}"><b>${i+1}</b><span>Team ${esc(t.name)}</span><em>${t.score.toLocaleString()} total</em><strong>+${t.last.toLocaleString()}</strong></div>`).join('')+'<div class="lbl sm" style="margin:6px 0 0">Players</div>':''}
      ${s.results.slice().sort((x,y)=>y.pts-x.pts).map((r,i)=>`<div class="rrow" style="--c:${r.color}"><b>${i+1}</b><span>${esc(r.name)} ${r.correct?'✅':'❌'}</span><em>${fk(r.dist)}</em><strong>+${r.pts.toLocaleString()}</strong></div>`).join('')}</div></div>
      <div class="row"><button class="btn good" data-act="gt-next">${s.idx+1>=s.total?'Final Scores':'Next Round ▸'}</button></div></div>`;
    if(typeof L==='undefined'){$('#gtmap').innerHTML='<p class="sub">Map needs internet.</p>';return;}
    const m=GT.map=L.map('gtmap',{worldCopyJump:true,minZoom:1,attributionControl:true}).setView([20,10],2);
    if(m.attributionControl)m.attributionControl.setPrefix(false);
    addTiles(m);
    const pts=[[a.lat,a.lon]];
    L.circle([a.lat,a.lon],{radius:Math.max(a.radius,.3)*1000,color:'#2fd573',weight:2,fillOpacity:.15}).addTo(m);
    L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',html:'<div class="gtstar">⭐</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(m);
    s.results.forEach(r=>{
      if(r.lat==null)return;pts.push([r.lat,r.lon]);
      L.polyline([[r.lat,r.lon],[a.lat,a.lon]],{color:r.color,weight:2,opacity:.8,dashArray:'5 6'}).addTo(m);
      L.marker([r.lat,r.lon],{icon:L.divIcon({className:'',html:`<div class="gtdot" style="background:${r.color}"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}).bindTooltip(r.name).addTo(m);
    });
    m.fitBounds(pts,{padding:[50,50],maxZoom:8});
    setTimeout(()=>m.invalidateSize(),100);
  },
};

/* ================= GAME 3: SPOT THE FAKE (live: everyone answers on their phone, Kahoot-style) ================= */
// Players tap the statement they think is the lie. A right answer is worth up to 1,000 points: the faster, the more (see src/worker.js).
const SF={
  iv:null,key:'',shown:false,
  stop(){clearInterval(SF.iv);SF.iv=null;SF.key='';SF.shown=false;},
  begin(){ // the room left its lobby (the host pressed Start, or refreshed mid-game)
    SF.stop();Snd.stop();lastGame='spotthefake';S.screen='sf';G={g:'sf',id:'spotthefake',lp:ROOM.st.players};renderBoard();SF.render();
  },
  again(){S.screen='sf';SF.shown=false;SF.key='';ROOM.post('/api/host/again');},
  render(){
    const s=ROOM.st;if(!s||!G||G.g!=='sf')return;
    if(s.phase==='closed')return;
    if(s.phase!=='end'&&S.screen==='results')S.screen='sf';
    renderBoard();
    if(s.phase==='lobby'){viewLobby();return;}
    else if(s.phase==='guess')SF.question();
    else if(s.phase==='reveal')SF.reveal();
    else if(s.phase==='end'&&!SF.shown){SF.shown=true;SF.key='';clearInterval(SF.iv);finish('FINAL SCORES');}
  },
  question(){
    const s=ROOM.st,k='q'+s.idx;
    if(SF.key!==k||!$('#sfq')){
      SF.key=k;Snd.loop('think');
      const p=s.prompt;
      $('#view').innerHTML=`<div id="sfq" class="clue" style="max-width:1150px"><div class="qhead"><span>${esc(p.topic)}</span><span>ROUND ${s.idx+1} / ${s.total}</span></div>
        <div class="bigq" style="font-size:clamp(20px,2.6vw,34px)">Two of these are TRUE. One is a LIE. <b>Tap the lie on your phone!</b></div>
        <div class="sfcards">${p.statements.map((t,i)=>`<div class="opt o${i}"><b>${i+1}</b><span>${esc(t)}</span></div>`).join('')}</div>
        <div class="lbl" id="sfans"></div>
        ${T.html(s.settings.seconds)}<div class="row" style="margin-top:0"><button class="btn alt" data-act="gt-reveal">Reveal now</button></div></div>`;
      clearInterval(SF.iv);let last=null;
      SF.iv=setInterval(()=>{
        const left=Math.max(0,(ROOM.st.deadline-(Date.now()+ROOM.off))/1000),tot=ROOM.st.settings.seconds,f=$('#tfill'),n=$('#tnum');
        if(f){f.style.width=(left/tot*100)+'%';f.style.backgroundPosition=((1-left/tot)*100)+'% 0';}
        if(n)n.textContent=Math.ceil(left);
        const ls=Math.ceil(left);if(ls!==last){last=ls;if(ls<=5&&ls>0)Snd.play(ls<=3?'tickHi':'tick');}
      },150);
    }

    $('#view').innerHTML=`<div id="sfr" class="clue" style="max-width:1150px"><div class="qhead"><span>${esc(a.topic)}</span><span>ROUND ${s.idx+1} / ${s.total}</span></div>
      <div class="sfcards">${a.statements.map((x,i)=>`<div class="opt o${i}${x.fake?' right':' truth'}"><b>${i+1}</b><span>${esc(x.t)}</span><em class="cnt">${x.fake?'🚨 FAKE':'✓ TRUE'} · ${a.counts[i]} picked it</em></div>`).join('')}</div>
      <div class="note">${esc(a.why)}</div>
      <div class="sub">${right} of ${s.results.length} spotted the fake · right answers score up to 1,000, faster = more</div>
      <div class="gtlist" style="max-width:760px;margin:6px auto;max-height:none">${s.results.slice().sort((x,y)=>y.pts-x.pts||x.name.localeCompare(y.name)).map((r,i)=>`<div class="rrow" style="--c:${r.color}"><b>${i+1}</b><span>${esc(r.name)} ${r.correct?'✅':(r.answer==null?'⏱':'❌')}</span><em>${r.correct?sec(r.ms):''}</em><strong>+${r.pts.toLocaleString()}</strong></div>`).join('')}</div>
      <div class="row"><button class="btn good" data-act="gt-next">${s.idx+1>=s.total?'Final Scores':'Next ▸'}</button></div></div>`;
  },
};

/* ================= GAME 4: CROWD CONTROL ================= */
const CC={
  start(){
    const b=BANKS.crowdcontrol,n=b.perGame||14,nr=Math.ceil(n*.55);
    resetScores();
    const rounds=shuffle([...shuffle(b.rather).slice(0,nr).map(r=>({k:'r',...r})),...shuffle(b.likely).slice(0,n-nr).map(t=>({k:'m',t}))]);
    G={g:'cc',id:'crowdcontrol',b,rounds,i:0};CC.round();
  },
  round(){
    G.stage='ask';G.marks=new Set();G.pick=null;G.res=null;S.screen='cc';Snd.loop('lobby');CC.draw();
    T.start(10,{tickFrom:3,onEnd:()=>{if(G.stage==='ask'){G.stage='tally';Snd.stop();Snd.play('reveal');CC.draw();}}});
  },
  draw(){
    const r=G.rounds[G.i],rv=G.stage==='result',a=G.marks.size,b=players.length-a;
    let h=`<div class="qhead"><span>${r.k==='r'?'WOULD YOU RATHER':'MOST LIKELY TO…'}</span><span>ROUND ${G.i+1} / ${G.rounds.length}</span></div><div class="clue" style="max-width:1150px">`;
    if(r.k==='r'){
      if(r.flip)h+=`<div class="note">🔥 UNDERDOG ROUND: the MINORITY scores double!</div>`;
      const cls=s=>rv?(G.res.win===s?' right':G.res.win?' dim':''):'';
      const cnt=(s,n)=>(G.stage==='tally'||rv)?`<em class="cnt">${n} vote${n===1?'':'s'}</em>`:'';
      h+=`<div class="opts"><div class="opt o1${cls('a')}"><b>A</b><span>${esc(r.a)}</span>${cnt('a',a)}</div><div class="opt o0${cls('b')}"><b>B</b><span>${esc(r.b)}</span>${cnt('b',b)}</div></div>`;
    }else{
      h+=`<div class="bigq" style="font-size:clamp(20px,2.6vw,34px)">Who here is most likely to…</div><div class="ddbanner" style="font-size:clamp(30px,5.5vw,76px);letter-spacing:2px;animation:none">${esc(r.t.toUpperCase())}?</div>`;
    }
    if(G.stage==='ask'){
      h+=T.html(10)+`<p class="sub">${r.k==='r'?'Everyone pick A or B. On 3, show your side!':'On 3, everyone point at someone!'}</p><div class="row" style="margin-top:0"><button class="btn alt" data-act="cc-tally">Count the votes ▸</button></div>`;
    }else if(G.stage==='tally'){
      if(r.k==='r'){
        h+=`<p class="sub">Tap everyone who chose <b style="color:var(--good)">A</b> (the rest count as B):</p>`+pgrid('cc-mark',p=>G.marks.has(p.id)?'ok':'')+
        `<div class="row"><button class="btn good" data-act="cc-lock">Lock it in</button></div>`;
      }else{
        h+=`<p class="sub">Tap the person who got the most fingers pointed at them:</p>`+pgrid('cc-pick',p=>G.pick===p.id?'sel':'')+
        `<div class="row"><button class="btn good" data-act="cc-crown" ${G.pick==null?'disabled':''}>👑 Crown them (+100)</button></div>`;
      }
    }else{
      if(r.k==='r'){
        h+=G.res.win?`<div class="verdict up">${G.res.win.toUpperCase()} ${r.flip?'UNDERDOGS WIN':'WINS'}! +${G.res.pts}</div>`:`<div class="verdict dn">TIE! Nobody scores</div>`;
      }else{
        const p=players[G.pick];h+=`<div class="verdict up">👑 ${esc(p.name)}</div><p class="sub">The room has spoken. +100</p>`;
      }
      h+=`<div class="row"><button class="btn good" data-act="cc-next">${G.i+1>=G.rounds.length?'Final Scores':'Next ▸'}</button></div>`;
    }
    $('#view').innerHTML=h+'</div>';renderBoard();
  },
};

/* ================= actions ================= */
const ACT={
  dec:()=>setCount(roster.n-1),inc:()=>setCount(roster.n+1),
  go:async()=>{ // open the lobby: create the room, then wait for players to join
    saveRoster();const btn=$('#gobtn');if(btn)btn.disabled=true;
    try{if(await ROOM.create(roster.n,roster.teams||0,roster.game))return viewLobby();throw new Error('no room');}
    catch(e){viewSetup('Could not open the lobby. Open the site\'s /host page (or run npm run dev), log in, and try again.');}
  },
  'pick-game':el=>{roster.game=el.dataset.id;saveRoster();document.querySelectorAll('[data-act=pick-game]').forEach(c=>c.classList.toggle('picked',c===el));const bp=$('#boardpick');if(bp)bp.hidden=roster.game!=='jeopardy';},
  'pick-board':el=>{roster.board=+el.dataset.i;saveRoster();const bp=$('#boardpick');if(bp)bp.innerHTML='<div class="lbl sm">Which board?</div>'+boardCards();},
  'start-game':()=>{const g=ROOM.st&&ROOM.st.settings.game;if(!g)return;if(g==='globetrotters'||g==='spotthefake')ROOM.post('/api/host/start');else startGame(g);},
  'new-room':()=>{if(!confirm('Start a brand-new game night? Everyone will need to join again with the new code.'))return;ROOM.leave();viewSetup();},
  'gt-shuffle':()=>ROOM.post('/api/host/teams',{shuffle:true}),
  'gt-move':el=>{const p=ROOM.st&&ROOM.st.players.find(x=>x.id===el.dataset.id);if(!p||!ROOM.st.teams)return;ROOM.post('/api/host/teams',{move:{pid:p.id,team:((p.team??-1)+1)%ROOM.st.teams.length}});},
  logout:async()=>{if(inGame()&&S.screen!=='results'&&!confirm('Log out and leave this game?'))return;try{await fetch('/api/logout',{method:'POST'});}catch(e){}location.href='/login';},
  home:()=>{if(inGame()&&S.screen!=='results'&&!confirm('Go back to the lobby? Scores will be lost.'))return;if(!ROOM.st)return viewSetup();leaveGame();viewLobby();},
  mute:()=>{$('#mutebtn').textContent=Snd.toggle()?'🔇':'🔊';},
  replay:()=>{if(G&&G.g==='gt')return GT.again();if(G&&G.g==='sf')return SF.again();startGame(lastGame);},

  /* big board */
  'jp-pick':el=>{
    const k=el.dataset.k,[ci,ri]=k.split('-').map(Number);
    G.cur={ci,ri,k,dd:G.dd.has(k),sel:null,stage:'open',wager:0};G.locked=new Set();Snd.stop();
    if(G.cur.dd){G.cur.stage='wager';Snd.play('dd');}else Snd.play('pick');
    JP.clue();
    if(G.cur.dd)JP.buzz('close');else JP.buzz('open',[]); // Daily Double: only the player in control answers, no buzzing
  },
  'jp-wager':()=>{const p=players[G.turn],max=Math.max(p.score,1000);let w=Math.round(+$('#wager').value/5)*5;w=Math.max(5,Math.min(max,w||5));G.cur.wager=w;G.cur.stage='open';Snd.play('reveal');JP.clue();},
  'jp-timer':()=>{Snd.loop('think');T.start((ROOM.st&&ROOM.st.settings.answerSeconds)||15,{onEnd:()=>{Snd.stop();Snd.play('timeup');}});},
  'jp-sel':el=>{G.cur.sel=+el.dataset.id;T.stop();Snd.stop();Snd.play('buzz');JP.clue();JP.buzz('close');if(ROOM.st&&ROOM.st.buzz&&ROOM.st.buzz.on)JP.startTimer();}, // picking someone by hand also starts the timer
  'jp-ok':()=>{
    const c=G.cur,pid=c.dd?G.turn:c.sel;if(pid==null)return;const amt=c.dd?c.wager:JP.cl().v;
    players[pid].score+=amt;G.turn=pid;c.stage='done';c.note=`${players[pid].name}  +${money(amt)}`;T.stop();Snd.stop();Snd.play('correct');JP.clue();JP.buzz('close');
  },
  'jp-no':()=>{
    const c=G.cur,pid=c.dd?G.turn:c.sel;if(pid==null)return;const amt=c.dd?c.wager:JP.cl().v;
    players[pid].score-=amt;c.sel=null;T.stop();Snd.stop();Snd.play('wrong');
    // with teams, a wrong answer locks out the whole team for this clue; otherwise just that player
    const out=ROOM.st&&ROOM.st.teams&&players[pid].team!=null?players.filter(p=>p.team===players[pid].team).map(p=>p.id):[pid];
    out.forEach(i=>G.locked.add(i));
    c.note=`${players[pid].name}  -${money(amt)}`;
    if(c.dd||c.peek||G.locked.size>=players.length){c.stage='done';JP.buzz('close');}else JP.buzz('open',[...G.locked]); // the others can buzz again (not once the answer has been shown)
    JP.clue();
  },
  'jp-peek':()=>{G.cur.peek=true;T.stop();Snd.stop();Snd.play('reveal');JP.buzz('hold');JP.clue();}, // show the answer, keep the buzzed-in player selected, then mark it
  'jp-reveal':()=>{G.cur.stage='done';G.cur.note='';T.stop();Snd.stop();Snd.play('reveal');JP.clue();JP.buzz('close');},
  'jp-back':()=>{G.used.add(G.cur.k);G.cur=null;JP.board();},
  'jp-final':()=>{if(confirm('Go to the Final Round now?')){JP.buzz('off');JP.final();}},
  'jp-fclue':()=>{
    document.querySelectorAll('.wcell input').forEach(i=>{const p=players[+i.dataset.id];G.f.w[p.id]=Math.max(0,Math.min(Math.max(0,p.score),Math.round(+i.value||0)));});
    G.f.stage='clue';Snd.loop('think');JP.final();T.start(30,{tickFrom:5,onEnd:()=>{Snd.stop();Snd.play('timeup');}});
  },
  'jp-freveal':()=>{T.stop();Snd.stop();Snd.play('reveal');G.f.stage='reveal';JP.final();},
  'jp-ftog':el=>{const id=+el.dataset.id;G.f.res[id]=((G.f.res[id]||0)+1)%3;JP.final();},
  'jp-fdone':()=>{try{const a=JSON.parse(localStorage.getItem('gn.jp.played')||'[]');if(!a.includes(G.bi))a.push(G.bi);localStorage.setItem('gn.jp.played',JSON.stringify(a));}catch(e){}
    players.forEach(p=>{const r=G.f.res[p.id]||0,w=G.f.w[p.id]||0;if(r===1)p.score+=w;else if(r===2)p.score-=w;});JP.buzz('off');finish('FINAL SCORES');},

  /* globe trotters (live) */
  'gt-reveal':()=>ROOM.post('/api/host/reveal'),
  'gt-next':()=>ROOM.post('/api/host/next'),

  /* crowd control */
  'cc-tally':()=>{T.stop();Snd.stop();Snd.play('reveal');G.stage='tally';CC.draw();},
  'cc-mark':el=>{const id=+el.dataset.id;G.marks.has(id)?G.marks.delete(id):G.marks.add(id);CC.draw();},
  'cc-pick':el=>{G.pick=+el.dataset.id;Snd.play('buzz');CC.draw();},
  'cc-lock':()=>{
    const r=G.rounds[G.i],a=G.marks.size,b=players.length-a,pts=r.flip?200:100;
    const win=a===b?null:((a>b)!==!!r.flip?'a':'b');
    if(win)players.forEach(p=>{if((win==='a')===G.marks.has(p.id))p.score+=pts;});
    G.res={win,pts};G.stage='result';Snd.play(win?'correct':'wrong');CC.draw();
  },
  'cc-crown':()=>{if(G.pick==null)return;players[G.pick].score+=100;G.stage='result';Snd.play('correct');CC.draw();},
  'cc-next':()=>{G.i++;if(G.i>=G.rounds.length)finish('FINAL SCORES');else CC.round();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  Snd.init();ACT[el.dataset.act]&&ACT[el.dataset.act](el);
});
const CHG={'jp-board':el=>{roster.board=+el.value;saveRoster();const i=$('#lboardinfo');if(i)i.innerHTML=boardCats(BANKS.jeopardy.boards[chosenBoard()]);},'teams':el=>{roster.teams=+el.value||0;saveRoster();},'gt-set':el=>{
  const k=el.dataset.k;let v=el.type==='checkbox'?el.checked:el.value;
  if(k!=='category'&&el.type!=='checkbox')v=+v;
  ROOM.post('/api/host/settings',{[k]:v});
}};
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el);});
if(location.protocol.startsWith('http')){$('#logoutbtn').hidden=false;fetch('/api/whoami').then(r=>r.json()).then(w=>{if(w.user)$('#logoutbtn').textContent='🔒 '+w.user+' · Log out';}).catch(()=>{});}
// after a page refresh, pick the same game night back up (same code, same players); otherwise start at setup
(async()=>{
  $('#view').innerHTML='<div class="sub" style="margin-top:20vh">Loading…</div>';
  let back=false;
  if(location.protocol.startsWith('http')){try{back=await ROOM.resume();}catch(e){}}
  if(back){if(!(G&&(G.g==='gt'||G.g==='sf')))viewLobby();}else viewSetup();
})();
</script>
