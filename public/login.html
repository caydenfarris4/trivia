<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host Login · Game Night Live</title>
<style>
:root{--bg:#050826;--gold:#ffcf3a;--gold2:#ff9d1c;--mute:#9fb0ff;--bad:#ff4d5e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#1b2a8a,var(--bg) 65%);color:#fff;font-family:"Segoe UI",system-ui,Arial,sans-serif;display:grid;place-items:center}
form{width:min(92vw,420px);display:flex;flex-direction:column;gap:12px;text-align:center}
.logo{font-family:Impact,"Arial Black",sans-serif;letter-spacing:3px;color:var(--gold);font-size:44px;text-shadow:0 3px 0 #8a4f00;margin:0;line-height:1.05}
.logo span{display:block;font-size:.4em;letter-spacing:10px;color:#fff}
a,.sub{font-size:14px}
.sub{color:var(--mute)}
input[hidden]{display:none}
input{font-size:22px;padding:14px;border-radius:12px;border:3px solid var(--gold);background:#000a;color:#fff;text-align:center;width:100%}
.btn{font-family:Impact,"Arial Black",sans-serif;letter-spacing:1.5px;font-size:24px;color:#2a1700;background:linear-gradient(#ffe27a,var(--gold2));border:0;border-bottom:5px solid #a65f00;border-radius:14px;padding:14px 20px;width:100%;text-transform:uppercase;cursor:pointer}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.eye{align-self:center;display:flex;gap:8px;align-items:center;font-size:15px;color:var(--mute);cursor:pointer;user-select:none}.eye input{width:20px;height:20px;padding:0;accent-color:var(--gold)}
.err{color:var(--bad);min-height:1.2em}
a{color:var(--mute)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1 class="logo">GAME NIGHT<span id="sub">HOST LOGIN</span></h1>
  <div class="sub" id="note"></div>
  <input id="user" placeholder="Username" autocomplete="username" maxlength="20" autocapitalize="off" spellcheck="false" autofocus>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <input id="pw2" type="password" placeholder="Confirm password" autocomplete="new-password" hidden>
  <input id="setup" type="password" placeholder="Setup code" autocomplete="off" hidden>
  <label class="eye"><input type="checkbox" id="eye"> 👁 Show password</label>
  <div class="err" id="err" role="alert"></div>
  <button class="btn" id="go" type="submit">Log in</button>
  <a href="/">Joining a game? Enter your code here</a>
</form>
<script>
const $ = s => document.querySelector(s);
let signup = false;
(async () => {
  try {
    const w = await (await fetch('/api/whoami')).json();
    if (w.host) { location.href = '/host'; return; }
    if (w.canSignup) {
      signup = true;
      $('#sub').textContent = 'CREATE HOST ACCOUNT';
      $('#note').textContent = 'No host account exists yet. The account you create now becomes the host, and sign-up then closes.';
      $('#pw').placeholder = 'Password (8+ characters)'; $('#pw').autocomplete = 'new-password';
      $('#pw2').hidden = false; $('#setup').hidden = !w.needsSetupCode;
      $('#go').textContent = 'Create account';
    }
  } catch (x) { $('#err').textContent = 'Can\'t reach the server.'; }
})();
$('#eye').onchange = () => { for (const id of ['#pw', '#pw2', '#setup']) $(id).type = $('#eye').checked ? 'text' : 'password'; };
$('#f').onsubmit = async e => {
  e.preventDefault();
  $('#err').textContent = '';
  if (signup && $('#pw').value !== $('#pw2').value) { $('#err').textContent = 'The two passwords don\'t match.'; return; }
  $('#go').disabled = true;
  try {
    const body = { username: $('#user').value, password: $('#pw').value };
    if (signup) body.setupCode = $('#setup').value;
    const r = await fetch(signup ? '/api/signup' : '/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/host'; return; }
    $('#err').textContent = j.error || 'Something went wrong.';
  } catch (x) { $('#err').textContent = 'Can\'t reach the server.'; }
  $('#go').disabled = false; $('#pw').select();
};
</script>
</body>
</html>
